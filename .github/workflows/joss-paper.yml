name: Build JOSS Paper

on:
  push:
    paths:
      - 'paper/**'
  pull_request:
    paths:
      - 'paper/**'
  workflow_dispatch:

jobs:
  build-paper:
    runs-on: ubuntu-latest
    name: Build JOSS Paper PDF
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      
    - name: Build paper PDF
      uses: docker://openjournals/inara@sha256:a0414b8b72fd8923917ede614d340d98dc7aa3102aabc2e955e9c02a6100fd62 # latest
      with:
        args: paper/paper.md
        
    - name: Upload paper artifacts
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: joss-paper
        path: |
          paper/paper.pdf
          paper/paper.crossref
        retention-days: 30
        
    - name: Check if paper PDF was generated
      run: |
        if [ -f paper/paper.pdf ]; then
          echo "✅ Paper PDF generated successfully"
          ls -la paper/paper.pdf
        else
          echo "❌ Paper PDF generation failed"
          exit 1
        fi