name: Security Checks

on:
  pull_request:
    branches: [ main ]

jobs:
  zizmor:
    name: Zizmor (Actions Security Audit)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.11'

    - name: Install zizmor
      run: pip install zizmor

    - name: Audit workflows
      run: zizmor .github/workflows

  actionlint:
    name: Actionlint
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Download actionlint
      run: bash <(curl -s https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)

    - name: Run actionlint
      run: ./actionlint -color

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Dependency review
      uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Run gitleaks
      uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  unicode-injection-scan:
    name: Hidden Unicode Scan (Docs)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Scan changed docs for hidden/invisible Unicode
      run: |
        mapfile -t CHANGED < <(git diff --name-only --diff-filter=ACM "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" -- '*.md' '*.rst' '*.txt')
        if [ ${#CHANGED[@]} -eq 0 ]; then
          echo "No documentation files changed."
          exit 0
        fi
        echo "Scanning: ${CHANGED[*]}"
        python3 .github/scripts/scan_hidden_unicode.py "${CHANGED[@]}"

  prompt-phrase-scan:
    name: Prompt Injection Phrase Scan (Docs)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Scan changed docs for suspicious instruction-style phrases
      run: |
        mapfile -t CHANGED < <(git diff --name-only --diff-filter=ACM "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" -- '*.md' '*.rst' '*.txt')
        if [ ${#CHANGED[@]} -eq 0 ]; then
          echo "No documentation files changed."
          exit 0
        fi

        PATTERN='ignore (all |the )?(previous|prior|above) instructions|disregard (the )?(above|previous|all prior)|new instructions:|you are now (a|an)|system prompt|do not (tell|inform|mention to) the user|act as (a|an) (unrestricted|jailbroken)|forget (everything|all previous)|<\|im_start\|>|###[[:space:]]*instruction|override your (instructions|guidelines)'

        FOUND=0
        for f in "${CHANGED[@]}"; do
          MATCHES=$(grep -inE "$PATTERN" "$f" || true)
          if [ -n "$MATCHES" ]; then
            FOUND=1
            echo "::warning file=$f::Possible prompt-injection phrasing found — needs manual review"
            {
              echo "## Possible prompt-injection phrasing in \`$f\`"
              echo '```'
              echo "$MATCHES"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
        done

        if [ "$FOUND" -eq 1 ]; then
          echo "Suspicious phrases found — see job summary. This is a heuristic check (warn-only), not a hard failure."
        else
          echo "No suspicious instruction-style phrases found."
        fi

  flag-workflow-changes:
    name: Flag Workflow File Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Check for changes under .github/workflows
      run: |
        CHANGED=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" -- .github/workflows/)
        if [ -n "$CHANGED" ]; then
          {
            echo "## ⚠️ This PR modifies GitHub Actions workflow files"
            echo "Changes to CI/CD configuration require careful manual review before merge, especially from external contributors."
            echo '```'
            echo "$CHANGED"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning::This PR modifies .github/workflows/ files — requires careful manual review"
        else
          echo "No workflow file changes detected."
        fi
